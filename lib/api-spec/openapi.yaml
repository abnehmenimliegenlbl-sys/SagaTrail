      responses:
        "200":
          description: Gespeichertes Profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Ungueltige Eingabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
