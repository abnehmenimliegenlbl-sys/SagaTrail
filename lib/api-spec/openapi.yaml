            "family", "elite_family"). DB-Spalte ist NOT NULL (Default "free").
        pendingPackRewards:
          type: integer
          description: >-
            Anzahl ausstehender Pack-Belohnungen aus erfolgreichen Einladungen.
            Wird > 0, sobald ein eingeladener Freund Premium kauft.
          default: 0
