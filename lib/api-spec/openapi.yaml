          type: string
          minLength: 2
        bio:
          type: string
          maxLength: 160
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        archetype:
          type: string
          enum: [reisende, hueterin, gewitzte, senn]
        homeCanton:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 2
