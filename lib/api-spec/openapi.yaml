          enum: [image/jpeg, image/png, image/webp]
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        heading:
          type: number
          nullable: true
          description: Blickrichtung in Grad, 0 = Norden.
        language:
          type: string
        nearbyContext:
          type: string
          nullable: true
          description: Kuratierter OSM-Kontext aus der aktuellen Umgebung.
      required:
        - imageBase64
        - mediaType
        - language
    AnalyzeObjectResponse:
      type: object
      properties:
        analysisNote:
          type: string
        candidates:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ObjectRecognitionCandidate"
      required:
        - analysisNote
        - candidates
    ObjectRecognitionLimitError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum: [OBJECT_RECOGNITION_DAILY_LIMIT]
        limit:
          type: integer
          example: 5
      required:
        - error
        - code
        - limit
    ObjectRecognitionCandidate:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        description:
          type: string
        whyLikely:
          type: string
        sourceUrl:
          type: string
          nullable: true
        sourceTitle:
          type: string
          nullable: true
        sourceExtract:
          type: string
          nullable: true
        sourceImage:
          type: string
          nullable: true
      required:
        - id
        - title
        - category
        - confidence
        - description
        - whyLikely
    LocalizedSummary:
      type: object
      properties:
        text:
          type: string
        reviewEmpfohlen:
          type: boolean
      required:
        - text
        - reviewEmpfohlen
    SagaQuelle:
      type: object
      properties:
        autor:
          type: string
        werk:
          type: string
        jahr:
          type: string
        fundstelleUrl:
          type: string
      required:
        - autor
        - werk
        - jahr
        - fundstelleUrl
    CatalogSaga:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        canton:
          type: string
        coreMotif:
          type: string
        bildmotiv:
          type: string
          description: >
            Konkreter, fotografierbarer Suchbegriff fuer das Sagenbild (z. B.
            "Vogel Gryff Basel", "Braunbär"), unabhaengig vom Handlungsort.
        mood:
          type: string
        summary:
          type: string
        summaries:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LocalizedSummary"
        altersstufenHinweis:
          type: string
        quelle:
          $ref: "#/components/schemas/SagaQuelle"
        source:
          type: string
        coordinates:
          $ref: "#/components/schemas/CatalogCoordinates"
        koordinatenSicherheit:
          type: string
          enum:
            - exakt
            - ungefaehr
            - nicht_lokalisierbar
            - Ort identifiziert
            - Region identifiziert
            - Muss GPS Verifiziert werden
            - Nur Kanton identifiziert
        isAnchorPlace:
          type: boolean
        fotoUrl:
          type: string
          nullable: true
          description: Gecachtes Foto aus Wikimedia Commons (Motiv-Suche). Null wenn noch kein Foto vorhanden.
        fotoAttribution:
          type: string
          nullable: true
          description: Urheber-/Lizenzangabe zum Sagenfoto.
      required:
        - id
        - title
        - canton
        - coreMotif
        - mood
        - summary
        - summaries
        - source
        - koordinatenSicherheit
        - isAnchorPlace
    CatalogResponse:
      type: object
      properties:
        cantons:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCanton"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/CatalogRoute"
        sagas:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSaga"
      required:
        - cantons
        - routes
        - sagas
    StoryDecisionOption:
      type: object
      properties:
        label:
          type: string
        archetypeHint:
          type: string
        tone:
          type: string
      required:
        - label
        - archetypeHint
        - tone
    StoryDecision:
      type: object
      properties:
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/StoryDecisionOption"
      required:
        - question
        - options
    StoryChapter:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        isDecisionPoint:
          type: boolean
        decision:
          $ref: "#/components/schemas/StoryDecision"
      required:
        - id
        - text
        - isDecisionPoint
    StoryRequest:
      type: object
      properties:
        sagaId:
          type: string
        archetype:
          type: string
          enum: [reisende, hueterin, gewitzte, senn]
        ageTier:
          type: string
          enum: [kinder, jugendliche, erwachsene]
        language:
          type: string
      required:
        - sagaId
        - archetype
        - ageTier
        - language
    StoryResponse:
      type: object
      properties:
        sagaId:
          type: string
        archetype:
          type: string
        ageTier:
          type: string
        language:
          type: string
        source:
          type: string
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/StoryChapter"
      required:
        - sagaId
        - archetype
        - ageTier
        - language
        - source
        - chapters
