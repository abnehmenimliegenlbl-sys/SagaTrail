          type: boolean
          description: Ob automatische Navigationsanweisungen waehrend der Wanderung abgespielt werden.
          default: true
        premium:
          type: boolean
        freeHikeUsed:
          type: boolean
          description: >-
            Ob die einmalige kostenlose Wanderung bereits verbraucht wurde.
            Solange false, ist genau eine Wanderung (egal welcher Kanton)
            auch ohne Premium freigeschaltet.
        purchasedPacks:
          type: array
          items:
            type: string
          description: >-
            Liste der DB-Pack-Slugs, die dieser Nutzer freigeschaltet hat
            (z.B. "schwyz", "bern_2"). Autoritaetive Quelle fuer Saga-Pack-Zugang.
        subscriptionTier:
          type: string
