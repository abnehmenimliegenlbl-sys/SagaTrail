            $ref: "#/components/schemas/HikeSession"
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
      required:
        - hikeHistory
        - achievements
    NarrationInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        language:
          type: string
          description: >-
            Sprachcode der Erzaehlung (bestimmt die Stimmwahl, z. B. eine
            Schweizer Faerbung fuer "gsw"). Der uebergebene Text muss fuer
            "gsw" bereits Hochdeutsch sein — Dialekt-Text wird nie an die TTS
            geschickt.
        provider:
          type: string
          enum: [elevenlabs, openai]
          description: >-
            Expliziter TTS-Anbieter. "openai" umgeht ElevenLabs vollstaendig
            und synthetisiert direkt mit OpenAI (guenstiger, fuer alle
            Nicht-Story-Inhalte: Einleitung, POIs, Meilensteine, Uebergaenge,
            Entscheidungs-Feedback). Fehlt der Wert, wird ElevenLabs mit
            OpenAI-Fallback verwendet (Story-Kapitel).
      required:
        - text
    CatalogCoordinates:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng
    CatalogCanton:
      type: object
      properties:
        canton:
          type: string
        routeCount:
          type: integer
      required:
        - canton
        - routeCount
    CatalogRoute:
      type: object
      properties:
        id:
          type: string
        sagaId:
          type: string
        name:
          type: string
        region:
          type: string
        distanceKm:
          type: number
          description: Aus der gespeicherten Geometrie berechnete Streckenlänge in km (weisse Kachel, Navigation).
        distanceTagKm:
          type: number
          description: Amtliche Distanz aus dem OSM-Relation-Tag `distance` (SchweizMobil-Wert); Fallback auf berechnete Geometrie-Distanz wenn kein Tag vorhanden. Immer gesetzt.
        ascentM:
          type: number
        maxElevationM:
          type: number
          description: Hoechster Punkt der Route in Metern ue. M. (swisstopo-Hoehenprofil).
        season:
          type: string
          enum: [ganzjaehrig, eher_sommer, nur_sommer]
          description: >
            Grobe Saison-Einschaetzung aus maximaler Hoehe und SAC-Schwierigkeit
            (Heuristik, keine amtliche Aussage zum aktuellen Zustand).
        minutes:
          type: number
        sac:
          type: string
        sacSource:
          type: string
          nullable: true
          description: Herkunft des SAC-Werts; osm_exact ist ein exakter OSM-Tag, swisstopo_derived eine amtliche Ableitung, unknown unbekannt.
        schweizMobilCondition:
          type: string
          nullable: true
          description: Offizielle SchweizMobil-Kategorie für Kondition (easy, medium oder difficult), nicht auf SAC umgerechnet.
        schweizMobilTechnique:
          type: string
          nullable: true
          description: Offizielle SchweizMobil-Kategorie für Technik (easy, medium oder difficult), nicht auf SAC umgerechnet.
        terrain:
          type: string
        familyFriendly:
          type: boolean
          nullable: true
          description: Konservative technische Familien-Empfehlung aus SAC, Distanz und Aufstieg; null bedeutet unbekannt.
        wheelchairAccessible:
          type: boolean
          nullable: true
          description: Offizielle SchweizMobil-Klassifikation handicap; wird nicht aus Distanz, Höhe oder SAC abgeleitet.
        technicalDifficulty:
          type: string
          nullable: true
        coordinates:
          $ref: "#/components/schemas/CatalogCoordinates"
        geometry:
          type: array
          description: Ausgeduennter Wegverlauf als [lat, lng]-Paare (nur bei realen OSM-Routen vorhanden).
          items:
            type: array
            items:
              type: number
        featured:
          type: boolean
        photoUrl:
          type: string
          nullable: true
          description: Foto-URL aus Wikimedia Commons, bereits in DB gecacht. Null wenn noch kein Foto vorhanden.
        photoAttribution:
          type: string
          nullable: true
          description: Urheber-/Lizenzangabe zum Foto.
        description:
          type: string
          nullable: true
          description: Kurzbeschreibung der Route aus Wikipedia (de); null wenn keine vorhanden.
        descriptionSource:
          type: string
          nullable: true
          description: URL des Wikipedia-Artikels, aus dem die Beschreibung stammt.
        themeKeys:
          type: array
          items:
            type: string
          description: Serverseitig geprüfte Themenbelege der Route.
        qualityStatus:
          type: string
          description: >
            Ergebnis des letzten Plausibilitätschecks: verified, partial, invalid
            oder unverified.
        qualityCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt des letzten erfolgreichen Qualitätschecks.
        sources:
          $ref: "#/components/schemas/RouteDataSources"
      required:
        - id
        - sagaId
        - name
        - region
        - distanceKm
        - distanceTagKm
        - ascentM
        - maxElevationM
        - season
        - minutes
        - sac
        - terrain
        - coordinates
        - featured
