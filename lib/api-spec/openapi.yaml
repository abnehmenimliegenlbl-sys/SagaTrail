  /routes/{routeId}/conditions:
    get:
      operationId: getRouteConditions
      tags: [community]
      summary: Community-Wegbedingungen abrufen
      description: >-
        Gibt die juengsten community-gemeldeten Wegbedingungen fuer eine Route
        zurueck (max. 10, nur der letzten 7 Tage). Kein Auth erforderlich.
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste der Berichte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrailConditionReport"
    post:
      operationId: reportRouteCondition
      tags: [community]
      summary: Wegbedingung melden
      description: >-
        Meldet eine neue Wegbedingung fuer eine Route. Authentifizierung
        erforderlich. Rate-Limit: max. 1 Bericht pro Nutzer und Route pro
        2 Stunden.
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrailConditionInput"
      responses:
        "201":
          description: Gespeicherter Bericht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrailConditionReport"
        "400":
          description: Ungueltige Eingabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Zu viele Berichte (Rate-Limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /narration:
    post:
      operationId: createNarration
      tags: [narration]
      summary: Kapitel-Erzaehlung als KI-Audio synthetisieren
      description: >-
        Synthetisiert den uebergebenen Erzaehltext als natuerlich klingende
        Audio-Erzaehlung via ElevenLabs (Premium-Feature, online-only, kein
        Offline-Fallback). Fuer Schweizerdeutsch (gsw) muss bereits der
        Hochdeutsch-Text uebergeben werden -- die Schweizer Faerbung kommt
        ausschliesslich ueber die Stimme, nie ueber Dialekt-Text. Ergebnisse
        werden serverseitig nach Textinhalt gecacht. Nur fuer Premium-Nutzer:
        die kostenlose erste Wanderung nutzt die on-device Stimme und ruft
        diesen Endpunkt nie auf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NarrationInput"
      responses:
        "200":
          description: MP3-Audiodaten der Erzaehlung
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Ungueltige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Premium erforderlich
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Sprachsynthese fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
