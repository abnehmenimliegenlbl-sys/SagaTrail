          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Treffpunkt geloescht
        "401":
          description: Anmeldung erforderlich
        "404":
          description: Treffpunkt nicht gefunden oder nicht berechtigt
  /meetups/{id}/cancel:
    post:
      operationId: cancelMeetup
      tags: [meetups]
      summary: Eigenen Treffpunkt absagen
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelMeetupRequest"
      responses:
        "204":
          description: Treffpunkt abgesagt
        "400":
          description: Ungültiger Absagegrund
        "401":
          description: Anmeldung erforderlich
        "404":
          description: Treffpunkt nicht gefunden oder nicht berechtigt
  /meetups/{id}/start:
    post:
      operationId: startMeetup
      tags: [meetups]
      summary: Treffpunkt starten
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Treffpunkt gestartet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetupLifecycleResponse" }
        "401": { description: Anmeldung erforderlich }
        "403": { description: Nur der Organisator darf starten }
        "404": { description: Treffpunkt nicht gefunden }
        "409": { description: Ungültiger Treffpunktstatus }
  /meetups/{id}/complete:
    post:
      operationId: completeMeetup
      tags: [meetups]
      summary: Treffpunkt abschliessen
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Treffpunkt abgeschlossen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetupLifecycleResponse" }
        "401": { description: Anmeldung erforderlich }
        "403": { description: Nur der Organisator darf abschliessen }
        "404": { description: Treffpunkt nicht gefunden }
        "409": { description: Ungültiger Treffpunktstatus }
  /meetups/{id}/messages:
    post:
      operationId: sendMeetupMessage
      tags: [meetups]
      summary: Nachricht an Treffpunktteilnehmer senden
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetupMessageRequest" }
      responses:
        "201":
          description: Nachricht in die Zustellung eingereiht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetupMessageResponse" }
        "400": { description: Ungültiger Nachrichtentext }
        "401": { description: Anmeldung erforderlich }
        "403": { description: Kein Treffpunktmitglied }
        "404": { description: Treffpunkt nicht gefunden }
        "409": { description: Treffpunkt beendet oder noch nicht gestartet }
        "429": { description: Nachrichtenlimit erreicht }
  /meetups/{id}/join:
    post:
      operationId: joinMeetup
      tags: [meetups]
      summary: Bei einem Treffpunkt mitwandern
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Teilnahme bestaetigt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupJoinResponse"
        "401":
          description: Anmeldung erforderlich
        "409":
          description: Treffpunkt voll oder bereits gestartet
    delete:
      operationId: leaveMeetup
      tags: [meetups]
      summary: Teilnahme an einem Treffpunkt aufheben
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Teilnahme aufgehoben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupJoinResponse"
        "401":
          description: Anmeldung erforderlich
  /meetups/{id}/attendance:
    patch:
      operationId: updateMeetupAttendance
      tags: [meetups]
      summary: Eigenen Anwesenheitsstatus aktualisieren
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetupAttendanceRequest"
      responses:
        "200":
          description: Anwesenheitsstatus aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupAttendanceResponse"
        "400":
          description: Ungültiger Anwesenheitsstatus
        "401":
          description: Anmeldung erforderlich
        "404":
          description: Treffpunkt oder Teilnahme nicht gefunden
        "409":
          description: Status kann nicht mehr geändert werden
        "429":
          description: Status wurde vor weniger als fünf Minuten geändert
  /meetups/{id}/share:
    post:
      operationId: createMeetupShare
      tags: [meetups]
      summary: Sicheren Treffpunkt-Link erstellen
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Temporärer Freigabelink
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupShareResponse"
        "401":
          description: Anmeldung erforderlich
        "403":
          description: Nur Teilnehmende dürfen teilen
        "404":
          description: Treffpunkt nicht gefunden
  /meetups/shared/{token}:
    get:
      operationId: getSharedMeetup
      tags: [meetups]
      summary: Öffentlichen Treffpunkt-Link laden
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Datenschutzreduzierter Treffpunkt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedMeetup"
        "404":
          description: Link unbekannt, abgelaufen oder widerrufen
  /meetups/{id}/report:
    post:
      operationId: reportMeetup
      tags: [meetups]
      summary: Treffpunkt oder Nutzer melden
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetupReportRequest"
      responses:
        "201":
          description: Meldung gespeichert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupActionResponse"
        "401":
          description: Anmeldung erforderlich
        "404":
          description: Treffpunkt nicht gefunden
  /meetups/{id}/block-organizer:
    post:
      operationId: blockMeetupOrganizer
      tags: [meetups]
      summary: Organisator eines Treffpunkts blockieren
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organisator blockiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupActionResponse"
        "401":
          description: Anmeldung erforderlich
        "404":
          description: Treffpunkt nicht gefunden
  /meetups/users/{userId}/block:
    post:
      operationId: blockMeetupUser
      tags: [meetups]
      summary: Nutzer für Treffpunkte blockieren
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Nutzer blockiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupActionResponse"
        "400":
          description: Selbstblockierung nicht möglich
        "401":
          description: Anmeldung erforderlich
    delete:
      operationId: unblockMeetupUser
      tags: [meetups]
      summary: Nutzerblockierung aufheben
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Nutzerblockierung aufgehoben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupActionResponse"
        "401":
          description: Anmeldung erforderlich
  /meetups/{id}/participants/{userId}:
    delete:
      operationId: removeMeetupParticipant
      tags: [meetups]
      summary: Teilnehmer als Organisator entfernen
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Teilnehmer entfernt
        "401":
          description: Anmeldung erforderlich
        "403":
          description: Nur der Organisator darf Teilnehmer entfernen
        "404":
          description: Treffpunkt oder Teilnehmer nicht gefunden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateMeetupRequest:
      type: object
      required: [routeId, routeName, canton, startsAt]
      properties:
        routeId:
          type: string
        routeName:
          type: string
        canton:
          type: string
        startsAt:
          type: string
          format: date-time
        maxParticipants:
          type: integer
          minimum: 2
          maximum: 30
          default: 8
        pace:
          type: string
          enum: [gemuetlich, normal, sportlich]
          default: gemuetlich
        note:
          type: string
          nullable: true
          maxLength: 500
    MeetupLifecycleResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed]
    MeetupMessageRequest:
      type: object
      required: [messageText]
      properties:
        messageText:
          type: string
          minLength: 1
          maxLength: 500
    MeetupMessageResponse:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean
    MeetupMessage:
      type: object
      required: [id, senderUserId, senderName, messageText, createdAt]
      properties:
        id:
          type: string
          format: uuid
        senderUserId:
          type: string
        senderName:
          type: string
        messageText:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
    Meetup:
      type: object
      required: [id, routeId, routeName, canton, startsAt, maxParticipants, participantCount, pace, organizerName, joined, status, isOrganizer]
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
        routeName:
          type: string
        canton:
          type: string
        startsAt:
          type: string
          format: date-time
        maxParticipants:
          type: integer
        participantCount:
          type: integer
        pace:
          type: string
        note:
          type: string
          nullable: true
        organizerName:
          type: string
        joined:
          type: boolean
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
        cancellationReason:
          type: string
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        isOrganizer:
          type: boolean
    MeetupParticipant:
      type: object
      required: [name, joinedAt]
      properties:
        userId:
          type: string
          description: Nur für authentifizierte, bereits beigetretene Teilnehmer sichtbar.
        avatarUrl:
          type: string
          nullable: true
        age:
          type: integer
          minimum: 13
          maximum: 120
          nullable: true
        name:
          type: string
        joinedAt:
          type: string
          format: date-time
        bio:
          type: string
          maxLength: 160
          nullable: true
        attendanceStatus:
          type: string
          enum: [confirmed, delayed, arrived]
        delayMinutes:
          type: integer
          nullable: true
        statusUpdatedAt:
          type: string
          format: date-time
        rankLevel:
          type: integer
          minimum: 0
          maximum: 9
          description: Server-verifizierter Gruppenrang für Mitwandernde; nur für Teilnehmende oder den Organisator sichtbar.
        groupAchievements:
          type: array
          description: Nur für Teilnehmende oder den Organisator sichtbar.
          items:
            type: object
            required: [id, threshold, title]
            properties:
              id:
                type: string
              threshold:
                type: integer
              title:
                type: string
    CancelMeetupRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 300
    MeetupAttendanceRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, delayed, arrived]
        delayMinutes:
          type: integer
          minimum: 5
          maximum: 180
          nullable: true
    MeetupAttendanceResponse:
      type: object
      required: [attendanceStatus, delayMinutes, statusUpdatedAt]
      properties:
        attendanceStatus:
          type: string
          enum: [confirmed, delayed, arrived]
        delayMinutes:
          type: integer
          nullable: true
        statusUpdatedAt:
          type: string
          format: date-time
    MeetupDetail:
      allOf:
        - $ref: "#/components/schemas/Meetup"
        - type: object
          required: [participants, messages]
          properties:
            participants:
              type: array
              items:
                $ref: "#/components/schemas/MeetupParticipant"
            messages:
              type: array
              description: Nachrichten sind nur für den Organisator und eingeschriebene Teilnehmende sichtbar.
              items:
                $ref: "#/components/schemas/MeetupMessage"
    MeetupListResponse:
      type: object
      required: [meetups]
      properties:
        meetups:
          type: array
          items:
            $ref: "#/components/schemas/Meetup"
    MeetupJoinResponse:
      type: object
      required: [joined]
      properties:
        joined:
          type: boolean
    MeetupShareResponse:
      type: object
      required: [token, path, expiresAt]
      properties:
        token:
          type: string
        path:
          type: string
        expiresAt:
          type: string
          format: date-time
    SharedMeetup:
      type: object
      required: [routeName, canton, startsAt, participantCount, maxParticipants, status, expiresAt]
      properties:
        routeName:
          type: string
        canton:
          type: string
        startsAt:
          type: string
          format: date-time
        participantCount:
          type: integer
        maxParticipants:
          type: integer
        status:
          type: string
          enum: [scheduled, cancelled]
        expiresAt:
          type: string
          format: date-time
    MeetupReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [safety, harassment, spam, other]
        reportedUserId:
          type: string
        note:
          type: string
          maxLength: 500
    MeetupActionResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    TerrainCorridorRequest:
      type: object
      required: [geometry]
      properties:
        geometry:
          type: array
          minItems: 2
          maxItems: 500
          items:
            type: array
            prefixItems:
              - type: number
              - type: number
            minItems: 2
            maxItems: 2
        options:
          type: object
          properties:
            rows:
              type: integer
              minimum: 12
              maximum: 80
              default: 32
            columns:
              type: integer
              minimum: 5
              maximum: 13
              default: 9
            halfWidthM:
              type: number
              minimum: 100
              maximum: 1500
              default: 500
    TerrainAreaRequest:
      type: object
      required: [geometry]
      properties:
        geometry:
          type: array
          minItems: 2
          maxItems: 500
          items:
            type: array
            prefixItems:
              - type: number
              - type: number
            minItems: 2
            maxItems: 2
        options:
          type: object
          properties:
            rows:
              type: integer
              minimum: 12
              maximum: 40
              default: 24
            columns:
              type: integer
              minimum: 12
              maximum: 40
              default: 24
            paddingM:
              type: number
              minimum: 500
              maximum: 5000
              default: 2000
            viewportAspect:
              type: number
              minimum: 0.4
              maximum: 1
              default: 0.4615384615
    TerrainCorridorCell:
      type: object
      required: [lat, lng, elevationM]
      properties:
        lat:
          type: number
        lng:
          type: number
        elevationM:
          type: [number, "null"]
    TerrainCorridorResponse:
      type: object
      required:
        [version, source, rows, columns, halfWidthM, routeLengthM, origin, bounds, fetchedAt, grid]
      properties:
        version:
          type: integer
          const: 1
        source:
          type: string
          const: SwissTopo DTM corridor profiles
        rows:
          type: integer
        columns:
          type: integer
        halfWidthM:
          type: number
        routeLengthM:
          type: number
        origin:
          type: object
          required: [lat, lng]
          properties:
            lat:
              type: number
            lng:
              type: number
        bounds:
          type: object
          required: [north, south, east, west]
          properties:
            north:
              type: number
            south:
              type: number
            east:
              type: number
            west:
              type: number
        fetchedAt:
          type: number
        grid:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/TerrainCorridorCell"
    TerrainAreaResponse:
      type: object
      required:
        [version, source, rows, columns, paddingM, viewportAspect, origin, bounds, fetchedAt, grid]
      properties:
        version:
          type: integer
          const: 1
        source:
          type: string
          const: SwissTopo DTM rectangular route area
        rows:
          type: integer
        columns:
          type: integer
        paddingM:
          type: number
        viewportAspect:
          type: number
        origin:
          type: object
          required: [lat, lng]
          properties:
            lat:
              type: number
            lng:
              type: number
        bounds:
          type: object
          required: [north, south, east, west]
          properties:
            north:
              type: number
            south:
              type: number
            east:
              type: number
            west:
              type: number
        fetchedAt:
          type: number
        grid:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/TerrainCorridorCell"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CreateSafetyShareRequest:
      type: object
      properties:
        routeName:
          type: string
          minLength: 1
          maxLength: 180
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 1440
      required: [routeName, durationMinutes]
    SafetyShare:
      allOf:
        - $ref: "#/components/schemas/SafetySharePublicStatus"
        - type: object
          properties:
            id:
              type: string
            token:
              type: string
            path:
              type: string
          required: [id, token, path]
    SafetySharePublicStatus:
      type: object
      properties:
        status:
          type: string
          enum: [active, ended, expired]
        routeName:
          type: string
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        latestLocation:
          allOf:
            - $ref: "#/components/schemas/SafetyShareLocation"
            - type: object
              properties:
                updatedAt:
                  type: string
                  format: date-time
              required: [updatedAt]
          nullable: true
      required: [status, routeName, startedAt, expiresAt, endedAt, latestLocation]
    SafetyShareLocation:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
        elevation:
          type: number
          nullable: true
          description: OSM-Höhe in Metern über Meer, sofern am POI gepflegt.
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          minimum: 0
          nullable: true
      required: [lat, lng]
    GpxImportBody:
      type: object
      properties:
        gpx:
          type: string
          description: Kompletter Inhalt der GPX-Datei (XML als Text)
          minLength: 1
        name:
          type: string
          description: Optionaler Anzeigename (z. B. Dateiname ohne Endung)
      required:
        - gpx
    CustomRouteWaypoint:
      type: object
      properties:
        lat:
          type: number
          minimum: 45
          maximum: 49
        lng:
          type: number
          minimum: 5
          maximum: 11
      required:
        - lat
        - lng
    CustomWaypointsBody:
      type: object
      properties:
        points:
          type: array
          minItems: 2
          maxItems: 12
          items:
            $ref: "#/components/schemas/CustomRouteWaypoint"
      required:
        - points
    CustomDrawnRouteBody:
      type: object
      properties:
        points:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: "#/components/schemas/CustomRouteWaypoint"
      required:
        - points
    ClaimKantonspackBody:
      type: object
      properties:
        kanton:
          type: string
          description: Kanton-Slug (z. B. "zuerich", wie kantonSlug(name))
      required:
        - kanton
    ClaimKantonspackResponse:
      type: object
      properties:
        entitlement:
          type: string
          description: Vergebenes Entitlement (pack_<kanton>)
        bereitsFreigeschaltet:
          type: boolean
          description: True, wenn der Kanton schon vorher freigeschaltet war
      required:
        - entitlement
        - bereitsFreigeschaltet
    Profile:
      type: object
      properties:
        id:
          type: string
          description: Clerk-Benutzer-ID
        name:
          type: string
        bio:
          type: string
          maxLength: 160
          nullable: true
        avatarUrl:
          type: string
          nullable: true
          description: Privater Objektpfad des Profilbilds
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Eigenes Geburtsdatum; wird nie in Community-Antworten ausgegeben
        archetype:
          type: string
          enum: [reisende, hueterin, gewitzte, senn]
        homeCanton:
          type: string
        language:
          type: string
        ageTier:
          type: string
          enum: [kinder, jugendliche, erwachsene]
        navAnnouncementsEnabled:
          type: boolean
          description: Ob automatische Navigationsanweisungen waehrend der Wanderung abgespielt werden.
          default: true
        premium:
          type: boolean
        freeHikeUsed:
          type: boolean
          description: >-
            Ob die einmalige kostenlose Wanderung bereits verbraucht wurde.
            Solange false, ist genau eine Wanderung (egal welcher Kanton)
            auch ohne Premium freigeschaltet.
        purchasedPacks:
          type: array
          items:
            type: string
          description: >-
            Liste der DB-Pack-Slugs, die dieser Nutzer freigeschaltet hat
            (z.B. "schwyz", "bern_2"). Autoritaetive Quelle fuer Saga-Pack-Zugang.
        subscriptionTier:
          type: string
          description: >-
            Abo-Stufe des Nutzers (z.B. "free", "premium", "elite",
            "family", "elite_family"). DB-Spalte ist NOT NULL (Default "free").
        pendingPackRewards:
          type: integer
          description: >-
            Anzahl ausstehender Pack-Belohnungen aus erfolgreichen Einladungen.
            Wird > 0, sobald ein eingeladener Freund Premium kauft.
          default: 0
