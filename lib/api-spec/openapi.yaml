   required: true
          schema:
            type: string
      responses:
        "200":
          description: Datenschutzreduzierter Treffpunkt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedMeetup"
        "404":
          description: Link unbekannt, abgelaufen oder widerrufen
  /meetups/{id}/report:
    post:
      operationId: reportMeetup
      tags: [meetups]
      summary: Treffpunkt oder Nutzer melden
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetupReportRequest"
      responses:
        "201":
          description: Meldung gespeichert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupActionResponse"
        "401":
          description: Anmeldung erforderlich
        "404":
          description: Treffpunkt nicht gefunden
  /meetups/{id}/block-organizer:
    post:
      operationId: blockMeetupOrganizer
      tags: [meetups]
      summary: Organisator eines Treffpunkts blockieren
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organisator blockiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupActionResponse"
        "401":
          description: Anmeldung erforderlich
        "404":
          description: Treffpunkt nicht gefunden
  /meetups/users/{userId}/block:
    post:
      operationId: blockMeetupUser
      tags: [meetups]
      summary: Nutzer für Treffpunkte blockieren
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Nutzer blockiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupActionResponse"
        "400":
          description: Selbstblockierung nicht möglich
        "401":
          description: Anmeldung erforderlich
    delete:
      operationId: unblockMeetupUser
      tags: [meetups]
      summary: Nutzerblockierung aufheben
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Nutzerblockierung aufgehoben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetupActionResponse"
        "401":
          description: Anmeldung erforderlich
  /meetups/{id}/participants/{userId}:
    delete:
      operationId: removeMeetupParticipant
      tags: [meetups]
      summary: Teilnehmer als Organisator entfernen
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Teilnehmer entfernt
        "401":
          description: Anmeldung erforderlich
        "403":
          description: Nur der Organisator darf Teilnehmer entfernen
        "404":
          description: Treffpunkt oder Teilnehmer nicht gefunden
  /communities/invitations/{slug}:
    get:
      operationId: getCommunityInvitation
      tags: [communities]
      summary: Öffentliche Community-Einladung laden
      description: >
        Liefert die freigegebenen Informationen einer SagaTrail-Community für
        eine Landingpage. Die Antwort enthält keinen privaten Kontostand und
        keine Mitgliederliste.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Community-Einladung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityInvitation"
        "404":
          description: Einladung nicht gefunden oder nicht mehr aktiv
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /communities/me:
    get:
      operationId: getMyCommunities
      tags: [communities]
      summary: Eigene aktive Communities laden
      description: >
        Liefert die aktiven Communities, denen der eingeloggte Nutzer
        angehört. Die Reihenfolge ist alphabetisch nach dem Community-Namen.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Eigene Communities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunitySummary"
        "401":
          description: Anmeldung erforderlich
  /communities/{id}/membership:
    delete:
      operationId: leaveCommunity
      tags: [communities]
      summary: Eigene Community-Mitgliedschaft beenden
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Community
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Mitgliedschaft beendet
        "401":
          description: Anmeldung erforderlich
        "404":
          description: Keine eigene Mitgliedschaft in dieser Community gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Community-Admins können ihre eigene Community nicht verlassen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /communities/invitations/by-code/{code}:
    get:
      operationId: getCommunityInvitationByCode
      tags: [communities]
      summary: Community-Einladung über den Fallback-Code laden
      description: >
        Löst einen kurzen Einladungscode auf. Der Code ist ein Fallback für
        Facebook-In-App-Browser und Store-Weiterleitungen.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-HJ-NP-Z2-9]{6,12}$"
      responses:
        "200":
          description: Community-Einladung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityInvitation"
        "404":
          description: Einladung nicht gefunden oder nicht mehr aktiv
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /communities/invitations/claim:
    post:
      operationId: claimCommunityInvitation
      tags: [communities]
      summary: Einer Community mit einem Einladungscode beitreten
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityClaimInput"
      responses:
        "200":
          description: Community-Beitritt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityMembership"
        "400":
          description: Ungültiger Einladungscode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Anmeldung erforderlich
        "404":
          description: Einladung nicht gefunden oder nicht mehr aktiv
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/communities:
    get:
      operationId: listCommunities
      tags: [communities]
      summary: SagaTrail-Communities verwalten
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Communities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityInvitation"
        "401":
          description: Ungültiges Admin-Token
    post:
      operationId: createCommunity
      tags: [communities]
      summary: Neue SagaTrail-Community mit Einladung anlegen
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityInput"
      responses:
        "201":
          description: Community angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityInvitation"
        "400":
          description: Ungültige Community-Daten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Ungültiges Admin-Token
        "409":
          description: Slug oder Einladungscode bereits vergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/communities/{id}:
    patch:
      operationId: updateCommunity
      tags: [communities]
      summary: Community-Einladung aktualisieren oder deaktivieren
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityUpdate"
      responses:
        "200":
          description: Aktualisierte Community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityInvitation"
        "400":
          description: Ungültige Community-Daten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Ungültiges Admin-Token
        "404":
          description: Community nicht gefunden
        "409":
          description: Slug oder Einladungscode bereits vergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CommunityInvitation:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - administratorName
        - language
        - inviteCode
        - active
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        administratorName:
          type: string
        language:
          type: string
        coverImageUrl:
          type: ["string", "null"]
          format: uri
        facebookGroupUrl:
          type: ["string", "null"]
          format: uri
        announcement:
          type: ["string", "null"]
        inviteCode:
          type: string
        appStoreUrl:
          type: string
          format: uri
        playStoreUrl:
          type: string
          format: uri
        deepLink:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommunitySummary:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - language
        - administratorName
        - memberCount
        - inviteCode
        - deepLink
        - active
        - joinedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        administratorName:
          type: string
        language:
          type: string
        coverImageUrl:
          type: ["string", "null"]
          format: uri
        facebookGroupUrl:
          type: ["string", "null"]
          format: uri
        announcement:
          type: ["string", "null"]
        memberCount:
          type: integer
          minimum: 0
        inviteCode:
          type: string
        deepLink:
          type: string
        active:
          type: boolean
        joinedAt:
          type: string
          format: date-time
    CommunityInput:
      type: object
      required: [slug, name, description, administratorName]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 1000
        administratorName:
          type: string
          minLength: 1
          maxLength: 120
        coverImageUrl:
          type: ["string", "null"]
          format: uri
        facebookGroupUrl:
          type: ["string", "null"]
          format: uri
        announcement:
          type: ["string", "null"]
        inviteCode:
          type: string
          pattern: "^[A-HJ-NP-Z2-9]{6,12}$"
        appStoreUrl:
          type: string
          format: uri
          default: https://apps.apple.com/app/id6788260668
        playStoreUrl:
          type: string
          format: uri
          default: https://play.google.com/store/apps/details?id=com.sagatrail2.app
        active:
          type: boolean
          default: true
    CommunityUpdate:
      type: object
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 1000
        administratorName:
          type: string
          minLength: 1
          maxLength: 120
        coverImageUrl:
          type: ["string", "null"]
          format: uri
        facebookGroupUrl:
          type: ["string", "null"]
          format: uri
        announcement:
          type: ["string", "null"]
        inviteCode:
          type: string
          pattern: "^[A-HJ-NP-Z2-9]{6,12}$"
        appStoreUrl:
          type: string
          format: uri
        playStoreUrl:
          type: string
          format: uri
        active:
          type: boolean
    CommunityClaimInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[A-HJ-NP-Z2-9]{6,12}$"
    CommunityMembership:
      type: object
      required: [joined, alreadyMember, community]
      properties:
        joined:
          type: boolean
        alreadyMember:
          type: boolean
        community:
          $ref: "#/components/schemas/CommunityInvitation"
    CreateMeetupRequest:
      type: object
      required: [routeId, routeName, canton, startsAt]
      properties:
        routeId:
          type: string
        routeName:
          type: string
        canton:
          type: string
        startsAt:
          type: string
          format: date-time
        maxParticipants:
          type: integer
          minimum: 2
          maximum: 30
          default: 8
        pace:
          type: string
          enum: [gemuetlich, normal, sportlich]
          default: gemuetlich
        note:
          type: string
          nullable: true
          maxLength: 500
        communityId:
          type: string
          format: uuid
          nullable: true
    UpdateMeetupRequest:
      type: object
      required: [startsAt, maxParticipants, pace, note]
      properties:
        startsAt:
          type: string
          format: date-time
        maxParticipants:
          type: integer
          minimum: 2
          maximum: 30
        pace:
          type: string
          enum: [gemuetlich, normal, sportlich]
        note:
          type: string
          nullable: true
          maxLength: 500
    MeetupLifecycleResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed]
    MeetupMessageRequest:
      type: object
      required: [messageText]
      properties:
        messageText:
          type: string
          minLength: 1
          maxLength: 500
    MeetupMessageResponse:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean
    MeetupMessage:
      type: object
      required: [id, senderUserId, senderName, messageText, createdAt]
      properties:
        id:
          type: string
          format: uuid
        senderUserId:
          type: string
        senderName:
          type: string
        messageText:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
    Meetup:
      type: object
      required: [id, routeId, routeName, canton, startsAt, maxParticipants, participantCount, pace, organizerName, joined, status, routeDistanceKm, routeDifficulty, routeStartLat, routeStartLng, isOrganizer, communityId, isWaitlisted, waitlistPosition, waitlistCount]
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
        routeName:
          type: string
        canton:
          type: string
        startsAt:
          type: string
          format: date-time
        maxParticipants:
          type: integer
        participantCount:
          type: integer
        pace:
          type: string
        note:
          type: string
          nullable: true
        communityId:
          type: string
          format: uuid
          nullable: true
        organizerName:
          type: string
        joined:
          type: boolean
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
        routeDistanceKm:
          type: ["number", "null"]
        routeDifficulty:
          type: ["string", "null"]
        routeStartLat:
          type: ["number", "null"]
        routeStartLng:
          type: ["number", "null"]
        isWaitlisted:
          type: boolean
        waitlistPosition:
          type: integer
          nullable: true
        waitlistCount:
          type: integer
        cancellationReason:
          type: string
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        isOrganizer:
          type: boolean
    MeetupParticipant:
      type: object
      required: [name, joinedAt]
      properties:
        userId:
          type: string
          description: Nur für authentifizierte, bereits beigetretene Teilnehmer sichtbar.
        avatarUrl:
          type: string
          nullable: true
        age:
          type: integer
          minimum: 13
          maximum: 120
          nullable: true
        name:
          type: string
        joinedAt:
          type: string
          format: date-time
        bio:
          type: string
          maxLength: 160
          nullable: true
        attendanceStatus:
          type: string
          enum: [confirmed, delayed, arrived]
        delayMinutes:
          type: integer
          nullable: true
        statusUpdatedAt:
          type: string
          format: date-time
        rankLevel:
          type: integer
          minimum: 0
          maximum: 9
          description: Server-verifizierter Gruppenrang für Mitwandernde; nur für Teilnehmende oder den Organisator sichtbar.
        groupAchievements:
          type: array
          description: Nur für Teilnehmende oder den Organisator sichtbar.
          items:
            type: object
            required: [id, threshold, title]
            properties:
              id:
                type: string
              threshold:
                type: integer
              title:
                type: string
    CancelMeetupRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 300
    MeetupAttendanceRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, delayed, arrived]
        delayMinutes:
          type: integer
          minimum: 5
          maximum: 180
          nullable: true
    MeetupAttendanceResponse:
      type: object
      required: [attendanceStatus, delayMinutes, statusUpdatedAt]
      properties:
        attendanceStatus:
          type: string
          enum: [confirmed, delayed, arrived]
        delayMinutes:
          type: integer
          nullable: true
        statusUpdatedAt:
          type: string
          format: date-time
    MeetupDetail:
      allOf:
        - $ref: "#/components/schemas/Meetup"
        - type: object
          required: [participants, messages]
          properties:
            participants:
              type: array
              items:
                $ref: "#/components/schemas/MeetupParticipant"
            messages:
              type: array
              description: Nachrichten sind nur für den Organisator und eingeschriebene Teilnehmende sichtbar.
              items:
                $ref: "#/components/schemas/MeetupMessage"
    MeetupListResponse:
      type: object
      required: [meetups]
      properties:
        meetups:
          type: array
          items:
            $ref: "#/components/schemas/Meetup"
    MeetupJoinResponse:
      type: object
      required: [joined, waitlisted, waitlistPosition]
      properties:
        joined:
          type: boolean
        waitlisted:
          type: boolean
        waitlistPosition:
          type: integer
          nullable: true
    MeetupShareResponse:
      type: object
      required: [token, path, expiresAt]
      properties:
        token:
          type: string
        path:
          type: string
        expiresAt:
          type: string
          format: date-time
    SharedMeetup:
      type: object
      required: [routeName, canton, startsAt, participantCount, maxParticipants, status, expiresAt]
      properties:
        routeName:
          type: string
        canton:
          type: string
        startsAt:
          type: string
          format: date-time
        participantCount:
          type: integer
        maxParticipants:
          type: integer
        status:
          type: string
          enum: [scheduled, cancelled]
        expiresAt:
          type: string
          format: date-time
    MeetupReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [safety, harassment, spam, other]
        reportedUserId:
          type: string
        note:
          type: string
          maxLength: 500
    MeetupActionResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    TerrainCorridorRequest:
      type: object
      required: [geometry]
      properties:
        geometry:
          type: array
          minItems: 2
          maxItems: 500
          items:
            type: array
            prefixItems:
              - type: number
              - type: number
            minItems: 2
            maxItems: 2
        options:
          type: object
          properties:
            rows:
              type: integer
              minimum: 12
              maximum: 80
              default: 32
            columns:
              type: integer
              minimum: 5
              maximum: 13
              default: 9
            halfWidthM:
              type: number
              minimum: 100
              maximum: 1500
              default: 500
    TerrainAreaRequest:
      type: object
      required: [geometry]
      properties:
        geometry:
          type: array
          minItems: 2
          maxItems: 500
          items:
            type: array
            prefixItems:
              - type: number
              - type: number
            minItems: 2
            maxItems: 2
        options:
          type: object
          properties:
            rows:
              type: integer
              minimum: 12
              maximum: 40
              default: 24
            columns:
              type: integer
              minimum: 12
              maximum: 40
              default: 24
            paddingM:
              type: number
              minimum: 500
              maximum: 5000
              default: 2000
            viewportAspect:
              type: number
              minimum: 0.4
              maximum: 1
              default: 0.4615384615
    TerrainCorridorCell:
      type: object
      required: [lat, lng, elevationM]
      properties:
        lat:
          type: number
        lng:
          type: number
        elevationM:
          type: [number, "null"]
    TerrainCorridorResponse:
      type: object
      required:
        [version, source, rows, columns, halfWidthM, routeLengthM, origin, bounds, fetchedAt, grid]
      properties:
        version:
          type: integer
          const: 1
        source:
          type: string
          const: SwissTopo DTM corridor profiles
        rows:
          type: integer
        columns:
          type: integer
        halfWidthM:
          type: number
        routeLengthM:
          type: number
        origin:
          type: object
          required: [lat, lng]
          properties:
            lat:
              type: number
            lng:
              type: number
        bounds:
          type: object
          required: [north, south, east, west]
          properties:
            north:
              type: number
            south:
              type: number
            east:
              type: number
            west:
              type: number
        fetchedAt:
          type: number
        grid:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/TerrainCorridorCell"
    TerrainAreaResponse:
      type: object
      required:
        [version, source, rows, columns, paddingM, viewportAspect, origin, bounds, fetchedAt, grid]
      properties:
        version:
          type: integer
          const: 1
        source:
          type: string
          const: SwissTopo DTM rectangular route area
        rows:
          type: integer
        columns:
          type: integer
        paddingM:
          type: number
        viewportAspect:
          type: number
        origin:
          type: object
          required: [lat, lng]
          properties:
            lat:
              type: number
            lng:
              type: number
        bounds:
          type: object
