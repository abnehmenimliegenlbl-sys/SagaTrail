        name:
          type: string
        bio:
          type: string
          maxLength: 160
          nullable: true
        avatarUrl:
          type: string
          nullable: true
          description: Privater Objektpfad des Profilbilds
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Eigenes Geburtsdatum; wird nie in Community-Antworten ausgegeben
        archetype:
          type: string
          enum: [reisende, hueterin, gewitzte, senn]
        homeCanton:
          type: string
        language:
          type: string
        ageTier:
          type: string
          enum: [kinder, jugendliche, erwachsene]
