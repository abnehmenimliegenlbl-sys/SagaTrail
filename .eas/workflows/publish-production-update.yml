name: Publish production OTA update

on:
  push:
    branches: ['main']

defaults:
  tools:
    pnpm: 10.26.1

jobs:
  verify_ota_source:
    name: Verify OTA source integrity
    steps:
      - name: Verify committed mobile source files
        run: node artifacts/mobile/scripts/verify-ota-source-integrity.mjs
  publish_production_update:
    name: Publish production OTA update
    needs: [verify_ota_source]
    type: update
    params:
      branch: production